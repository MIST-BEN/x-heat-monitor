<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>X Heat Pulse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1c3f 0%, #060911 75%);
      color: #f8fafc;
      padding: 15px;
      user-select: none;
      letter-spacing: -0.01em;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14.5px;
      color: #38bdf8;
      letter-spacing: -0.02em;
    }
    .brand svg {
      width: 18px;
      height: 18px;
      fill: #38bdf8;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.5));
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }
    .tag.live {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 5px;
      border-radius: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-icon:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-0.5px);
    }
    .spinning {
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Main Delta Card */
    .hero-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 10px 24px -4px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .hero-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .account-selector {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 9999px;
      padding: 2px 8px;
      color: #38bdf8;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-transform: none;
    }
    .account-selector:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }
    .account-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .hero-val-container {
      display: flex;
      align-items: baseline;
      margin-top: 6px;
      gap: 8px;
    }
    .hero-val {
      font-size: 34px;
      font-weight: 800;
      color: #38bdf8;
      font-feature-settings: "tnum";
      line-height: 1;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .hero-unit {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
    .hero-burst {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* Sparkline Chart */
    .sparkline-container {
      margin-top: 10px;
      width: 100%;
      height: 40px;
    }
    svg.sparkline {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sparkline-path {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      filter: drop-shadow(0 2px 4px rgba(56, 189, 248, 0.4));
    }
    .sparkline-area {
      fill: url(#chart-gradient);
    }

    /* Metric Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .metric-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
      transition: all 0.2s;
    }
    .metric-item:hover {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .metric-item .title {
      font-size: 9.5px;
      color: #64748b;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .metric-item .delta {
      font-size: 14px;
      font-weight: 700;
      color: #34d399;
      font-feature-settings: "tnum";
    }

    /* Top Posts */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .filter-tab {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .filter-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
    }
    .filter-tab.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    .section-title {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .posts-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .post-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 11px;
      line-height: 1.4;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .post-card:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(56, 189, 248, 0.25);
      transform: translateY(-0.5px);
    }
    .post-text {
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .post-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #64748b;
      font-size: 10px;
    }
    .post-delta {
      font-weight: 600;
      font-feature-settings: "tnum";
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #475569;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: #7dd3fc;
    }

    /* Account Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-card {
      background: #090e18;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95);
    }
    .modal-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .modal-input-group {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0 10px;
      margin-bottom: 14px;
    }
    .modal-input-group:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .modal-prefix {
      color: #64748b;
      font-weight: 600;
      font-size: 13px;
    }
    #modal-handle-input {
      background: transparent;
      border: none;
      color: #f8fafc;
      padding: 8px 6px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-modal-cancel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-modal-save {
      background: #0284c7;
      border: none;
      color: #ffffff;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-modal-save:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span>X Heat Pulse</span>
    </div>
    <div class="header-actions">
      <span class="tag live" id="status-tag">3m 实时监控中</span>
      <button class="btn-icon" id="btn-refresh" title="立即采样 (强制刷新)">
        <svg id="icon-refresh" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
      </button>
      <button class="btn-icon" id="btn-settings" title="配置采样参数与告警">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Hero Delta Card -->
  <div class="hero-card">
    <div class="hero-label">
      <span id="label-delta-title">近3分钟曝光增量</span>
      <div class="account-selector" id="account-btn" title="点击切换或修改监控账号">
        <span class="account-dot"></span>
        <span id="account-name">@sben96001</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="hero-val-container">
      <span class="hero-val" id="delta-heat">+0</span>
      <span class="hero-unit" id="label-delta-unit">次曝光</span>
      <span class="hero-burst" id="delta-rate">就绪</span>
    </div>

    <!-- Sparkline -->
    <div class="sparkline-container">
      <svg class="sparkline" id="sparkline-svg" viewBox="0 0 320 40">
        <defs>
          <linearGradient id="chart-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path class="sparkline-area" id="sparkline-area" d=""/>
        <path class="sparkline-path" id="sparkline-path" d=""/>
      </svg>
    </div>
  </div>

  <!-- 5-Metric Breakdown Grid -->
  <div class="metric-grid">
    <div class="metric-item">
      <div class="title">赞 (Likes)</div>
      <div class="delta" id="d-likes">+0</div>
    </div>
    <div class="metric-item">
      <div class="title">转 (Retweets)</div>
      <div class="delta" id="d-rts">+0</div>
    </div>
    <div class="metric-item">
      <div class="title">评 (Replies)</div>
      <div class="delta" id="d-replies">+0</div>
    </div>
    <div class="metric-item">
      <div class="title">藏 (Bookmarks)</div>
      <div class="delta" id="d-bookmarks">+0</div>
    </div>
    <div class="metric-item">
      <div class="title">阅 (Views)</div>
      <div class="delta" id="d-views">+0</div>
    </div>
    <div class="metric-item">
      <div class="title">周期 (Interval)</div>
      <div class="delta" style="color:#94a3b8; font-size:13px;" id="d-interval">3m</div>
    </div>
  </div>

  <!-- Scope Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" id="tab-own">👤 我的专属帖子</button>
    <button class="filter-tab" id="tab-all">🌐 发现信息流</button>
  </div>

  <!-- Top Monitored Posts -->
  <div class="section-title">
    <span id="posts-list-title">我的活跃帖子</span>
    <span id="monitored-count">监控中: 0</span>
  </div>
  <div class="posts-list" id="posts-container">
    <div style="color:#64748b; text-align:center; padding: 22px 0;">正在捕获页面推文...</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="last-update">采样更新: --</span>
    <a id="link-options">⚙️ 偏好设置</a>
  </div>

  <!-- Quick Account Edit Modal -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal-card">
      <div class="modal-title">👤 绑定要监控的 X 创作者账号</div>
      <div class="modal-desc">输入您的 X 用户名（无需包含 @），插件将专属追踪此账号推文的曝光浏览与增量！</div>
      <div class="modal-input-group">
        <span class="modal-prefix">@</span>
        <input type="text" id="modal-handle-input" placeholder="sben96001" value="sben96001" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btn-modal-cancel">取消</button>
        <button class="btn-modal-save" id="btn-modal-save">锁定并监控此账号</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
